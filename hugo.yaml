baseURL: "http://drmvlfs3gt0ln.cloudfront.net/"
title: Pablo Lopez - Software Engineer & AI Contractor
theme: PaperMod
pagination:
  pagerSize: 20
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
minify:
  disableXML: true
  minifyOutput: true
params:
  env: production # to enable google analytics, opengraph, twitter-cards and schema.
  title: Pablo Lopez - Software Engineer & AI Contractor
  description: "Building scalable backend systems, data platforms, and AI/ML infrastructure. Available for contracting in Python, AWS, and Kubernetes."
  keywords: [Contractor, Software Engineer, Python, AWS, Data Engineering, Machine Learning]
  images: ["<link or path of image for opengraph, twitter-cards>"]
  DateFormat: "January 2, 2006"
  defaultTheme: light # dark, light
  disableThemeToggle: true
  ShowShareButtons: true
  ShowPostNavLinks: trued
  ShowBreadCrumbs: false
  ShowCodeCopyButtons: false
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: false
  tocOpen: false
  ShowReadingTime: true
  ShowWordCount: false
  assets:
    # disableHLJS: true # to disable highlight.js
    # disableFingerprinting: true
    favicon: "<link / abs url>"
    favicon16x16: "<link / abs url>"
    favicon32x32: "<link / abs url>"
    apple_touch_icon: "<link / abs url>"
    safari_pinned_tab: "<link / abs url>"
  label:
    text: "Pablo Lopez"
    icon: /apple-touch-icon.png
    iconHeight: 35
  # profile-mode
  profileMode:
    enabled: false
  socialIcons:
    - name: github
      url: "https://github.com/wanderdust"
    - name: buymeacoffee
      url: "https://buymeacoffee.com/pablolopeza"
  analytics:
    google:
      SiteVerificationTag: "G-X9HF8XB2LH"
  cover:
    hidden: true # hide everywhere but not in structured data
    hiddenInList: true # hide on list pages and home
    hiddenInSingle: true # hide on single page
  # for search
  # https://fusejs.io/api/options.html
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    limit: 10 # refer: https://www.fusejs.io/api/methods.html#search
    keys: ["title", "permalink", "summary", "content"]
menu:
  main:
    - identifier: services
      name: Services
      url: /#services
      weight: 1
    - identifier: blog
      name: Writing
      url: /posts/
      weight: 5
# Read: https://github.com/adityatelange/hugo-PaperMod/wiki/FAQs#using-hugos-syntax-highlighter-chroma
pygmentsUseClasses: true
markup:
  highlight:
    noClasses: false
    # anchorLineNos: true
    # codeFences: true
    # guessSyntax: true
    # lineNos: true
    # style: monokai
  goldmark:
    renderer:
      unsafe: true
caches:
  images:
    dir: :cacheDir/images
